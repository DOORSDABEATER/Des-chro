
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source project
        run: |
          mkdir -p project
          unzip -q "DeS-Chronicles-phase1 (3).zip" -d project

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Validate resource pack
        working-directory: project
        run: python3 tools/validate_pack.py

      - name: Build plugin
        run: gradle -p project build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeS-Chronicles
          path: project/build/libs/*.jar
          if-no-files-found: error
          
